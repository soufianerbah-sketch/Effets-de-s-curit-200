<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجلّ EPI والحوادث والعقوبات</title>
<style>
:root{--bg:#eaf0ec;--card:#fff;--ink:#17211c;--mute:#5a6b62;--line:#cfd8d1;--acc:#0f6b4f;--accT:#fff;--warn:#b4570a;--bad:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#17221c;--ink:#e6efe9;--mute:#98aaa0;--line:#2a3a31;--acc:#5fd0a5;--accT:#06231a;--warn:#f0a35a;--bad:#ff8f86}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#17221c;--ink:#e6efe9;--mute:#98aaa0;--line:#2a3a31;--acc:#5fd0a5;--accT:#06231a;--warn:#f0a35a;--bad:#ff8f86}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
.logo{display:block;width:76px;height:76px;object-fit:contain;background:#fff;border-radius:12px;padding:3px;margin:0 auto 6px}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,#f2c200 0 14px,#17211c 14px 28px)}
header{background:var(--card);border-bottom:1px solid var(--line);text-align:center;padding:8px 12px;font-size:14px;color:var(--mute)}
header b{color:var(--ink);font-size:16px}
main{max-width:680px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;min-height:46px}
button.main{background:var(--acc);color:var(--accT);border-color:var(--acc);width:100%;margin-top:14px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:14px}
.nav button{padding:10px 2px;font-size:13px}
.nav button.on,.seg button.on{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.who div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:56px}
.who small{display:block;color:var(--mute);font-size:13px}
.hint{font-size:14px;margin-top:6px;min-height:22px}
.err{color:var(--bad)}
.mut{color:var(--mute);font-size:14px}
.it{border:1px solid var(--line);border-right:6px solid var(--acc);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.it.inc{border-right-color:var(--warn)}.it.sanc{border-right-color:var(--bad)}
.it .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.it button{min-height:34px;padding:4px 12px;font-size:14px;color:var(--bad)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;text-align:center}
.sum div{border:1px solid var(--line);border-radius:10px;padding:8px}
.sum b{font-size:22px;display:block}
#lock{max-width:380px;margin:40px auto;text-align:center}
#pin{text-align:center;font-size:28px;letter-spacing:10px;direction:ltr}
textarea{min-height:110px}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ms[hidden]{display:none}
.ms label{display:flex;gap:8px;align-items:center;margin:0;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.ms input{width:20px;height:20px;accent-color:var(--acc)}
</style>

<main id="app">
<section id="lock" class="card">
<h1 id="lt">جاري التهيئة...</h1>
<p id="ls" class="mut"></p>
<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" disabled>
<div id="lm" class="hint err" role="status"></div>
</section>
<section id="main" hidden></section>
</main>

<script>
(function(){
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nk=s=>String(s).trim().replace(/^0+(?=\d)/,'');
const TYPES={
 epi:{label:'تسليم EPI',kl:'نوع EPI',cls:'',opts:['خوذة','حذاء سلامة','قفازات','نظارات واقية','قناع غبار','سدادات الأذن','سترة عاكسة','لباس العمل','حزام أمان','أخرى']},
 inc:{label:'حادث',kl:'نوع الحادث',cls:'inc',opts:['سقوط','جرح','حرق','ضربة','إصابة في الظهر','سقوط شيء على العامل','حادث مرور داخل الموقع','إصابة في العين','أخرى']},
 sanc:{label:'عقوبة',kl:'نوع العقوبة',cls:'sanc',opts:['إنذار شفوي','إنذار كتابي','توبيخ','توقيف يوم إلى 3 أيام','توقيف أكثر من 3 أيام','إحالة على لجنة التأديب','أخرى']}
};
let db=null,cfg={},W=[],WM=new Map(),R=[],mode='login',tmp='',tab='rec',cur='epi';
const lsG=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const toISO=s=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s.trim());if(!m)return null;const d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31||y<1990||y>2100)return null;return y+'-'+pad(mo)+'-'+pad(d)};
const fromISO=s=>{const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
async function H(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('epi:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'epi:'+s)h=(h*33)^c.charCodeAt(0);return 'x'+(h>>>0)}}
function lm(t){$('lm').textContent=t||''}

/* storage */
async function saveCfg(){if(db)await db.doc('config/main').set(cfg);else lsS('c',cfg)}
async function saveW(){if(db)await db.doc('workers/list').set({items:W});else lsS('w',W);idx()}
async function saveR(r){if(db)await db.doc('records/'+r.id).set(r);else lsS('r',R)}
async function delR(id){if(db)await db.doc('records/'+id).delete();else lsS('r',R)}
function idx(){WM=new Map(W.map(w=>[nk(w[0]),w]))}
async function loadAll(){
  if(db){
    const w=await db.doc('workers/list').get();W=w.exists?(w.data().items||[]):[];
    const q=await db.collection('records').get();R=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
  }else{W=lsG('w',[]);R=lsG('r',[])}
  idx();
}

/* lock */
function lockText(){
  const t={login:['أدخل الرمز السرّي','6 أرقام. يفتح التطبيق مباشرة.'],set1:['أنشئ رمزا سرّيا','اختار 6 أرقام للدخول للتطبيق.'],set2:['أعد كتابة الرمز','للتأكيد.']}[mode];
  $('lt').textContent=t[0];$('ls').textContent=t[1];$('pin').disabled=false;$('pin').focus();
}
async function init(){
  try{
    if(window.claude&&claude.use){db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),4000))])}
    if(db){const c=await db.doc('config/main').get();cfg=c.exists?c.data():{}}else cfg=lsG('c',{});
  }catch(e){db=null;cfg=lsG('c',{})}
  mode=cfg.pin?'login':'set1';lockText();
}
$('pin').addEventListener('input',async()=>{
  const v=$('pin').value.replace(/\D/g,'');$('pin').value=v;if(v.length<6)return;
  $('pin').value='';lm('');
  try{
    if(mode==='login'){if(await H(v)===cfg.pin)await enter();else lm('الرمز غير صحيح.')}
    else if(mode==='set1'){tmp=v;mode='set2';lockText()}
    else{if(v===tmp){cfg.pin=await H(v);await saveCfg();await enter()}else{mode='set1';lockText();lm('الرمزان ما تطابقوش. عاود.')}}
  }catch(e){lm('وقع مشكل: '+(e&&(e.code||e.message)||'خطأ'))}
});
async function enter(){await loadAll();$('lock').hidden=true;$('main').hidden=false;show('rec')}
function lockNow(){$('main').hidden=true;$('lock').hidden=false;mode='login';lockText();lm('')}

/* views */
function show(t){
  tab=t;const names={rec:'تسجيل',sea:'بحث',his:'السجلّ',wrk:'العمال',set:'إعدادات'};
  $('main').innerHTML='<div class="nav">'+Object.keys(names).map(k=>'<button data-t="'+k+'" class="'+(k===t?'on':'')+'">'+names[k]+'</button>').join('')+'</div><div id="v"></div>';
  ({rec:vRec,sea:vSea,his:vHis,wrk:vWrk,set:vSet})[t]();
}
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)show(b.dataset.t)});
function who(m){const w=WM.get(nk(m));return w}
function vRec(){
  $('v').innerHTML=`<div class="card"><label for="mat">القيد (رقم التسجيل)</label><input id="mat" inputmode="numeric" autocomplete="off">
  <div class="who"><div><small>اللقب</small><span id="wl">-</span></div><div><small>الاسم</small><span id="wn">-</span></div></div><div id="wh" class="hint"></div>
  <div class="seg">${Object.keys(TYPES).map(k=>'<button data-k="'+k+'" class="'+(k===cur?'on':'')+'">'+TYPES[k].label+'</button>').join('')}</div>
  <label for="dt">التاريخ</label><input id="dt" inputmode="numeric" maxlength="10" value="${today()}">
  <label for="kind" id="kl"></label><select id="kind"></select><div id="kmulti" class="ms" hidden></div>
  <label for="note">ملاحظات</label><textarea id="note" rows="2"></textarea>
  <button class="main" id="add">تسجيل</button><div id="rm" class="hint" role="status"></div></div>`;
  fillKinds();
  $('mat').addEventListener('input',lookup);
  $('dt').addEventListener('input',()=>{const d=$('dt').value.replace(/\D/g,'').slice(0,8);$('dt').value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d});
  document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;cur=b.dataset.k;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));fillKinds()});
  $('add').addEventListener('click',addRec);
}
function fillKinds(){const m=cur==='epi';$('kl').textContent=TYPES[cur].kl+(m?' (تقدر تختار عدة أنواع)':'');$('kind').hidden=m;$('kmulti').hidden=!m;
  $('kind').innerHTML=TYPES[cur].opts.map(o=>'<option>'+o+'</option>').join('');
  $('kmulti').innerHTML=TYPES.epi.opts.map(o=>'<label><input type="checkbox" value="'+o+'">'+o+'</label>').join('')}
function lookup(){
  const m=$('mat').value,w=m.trim()?who(m):null;
  $('wl').textContent=w?(w[1]||w[2]?w[1]:'-'):'-';$('wn').textContent=w?(w[2]||(w[1]?'':'-')):'-';
  const h=$('wh');h.className='hint';
  if(!m.trim())h.textContent='';else if(!w){h.textContent='هذا القيد غير موجود في قاعدة البيانات. زيدو من صفحة «العمال».';h.className='hint err'}else h.textContent='';
}
async function addRec(){
  const m=$('mat').value.trim(),w=m?who(m):null,iso=toISO($('dt').value),rm=$('rm');rm.className='hint err';
  if(!w){rm.textContent='أدخل قيد موجود في قاعدة البيانات.';return}
  if(!iso){rm.textContent='التاريخ غير صحيح. اكتبو هكذا: 25/10/2026';return}
  const kv=cur==='epi'?[...document.querySelectorAll('#kmulti input:checked')].map(x=>x.value).join(' + '):$('kind').value;
  if(!kv){rm.textContent='اختار نوع EPI واحد على الأقل.';return}
  const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),m:w[0],t:cur,k:kv,d:iso,note:$('note').value.trim(),ts:Date.now()};
  try{R.push(r);await saveR(r);rm.className='hint';rm.textContent='تسجّل ✓ '+TYPES[cur].label+' للعامل '+w[1]+' '+w[2];$('note').value='';$('mat').value='';document.querySelectorAll('#kmulti input').forEach(x=>x.checked=false);lookup()}
  catch(e){R.pop();rm.textContent='ما تسجّلش ('+(e&&(e.code||e.message)||'خطأ')+'). ممكن ما عندكش صلاحية الكتابة.'}
}
function vHis(){
  $('v').innerHTML='<div class="card"><label for="q">بحث بالقيد أو الاسم</label><input id="q" autocomplete="off"><div id="sm"></div></div><div id="lst"></div>';
  $('q').addEventListener('input',lst);$('lst').addEventListener('click',async e=>{
    const b=e.target.closest('[data-del]');if(!b)return;if(!confirm('حذف هذا التسجيل؟'))return;
    const i=R.findIndex(x=>x.id===b.dataset.del);if(i<0)return;const r=R.splice(i,1)[0];
    try{await delR(r.id)}catch(er){R.push(r)}lst();
  });lst();
}
function wname(m){const w=who(m);return w?((w[1]+' '+w[2]).trim()||m):m}
function lst(){
  const q=$('q').value.trim().toLowerCase();
  let rows=R.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);
  if(q)rows=rows.filter(r=>nk(r.m)===nk(q)||wname(r.m).toLowerCase().includes(q));
  const ws=q&&who(q)?who(q):null;
  $('sm').innerHTML=ws?'<div class="sum">'+Object.keys(TYPES).map(k=>'<div><b>'+rows.filter(r=>r.t===k).length+'</b>'+TYPES[k].label+'</div>').join('')+'</div><div>'+esc((ws[1]+' '+ws[2]).trim())+'</div>':'';
  $('lst').innerHTML=rows.length?rows.slice(0,200).map(r=>'<div class="it '+TYPES[r.t].cls+'"><div class="top"><span><b>'+esc(wname(r.m))+'</b> <span class="mut">القيد '+esc(r.m)+'</span></span><span class="mut">'+fromISO(r.d)+'</span></div><div>'+TYPES[r.t].label+': '+esc(r.k)+'</div>'+(r.note?'<div class="mut">'+esc(r.note)+'</div>':'')+'<button data-del="'+r.id+'">حذف</button></div>').join(''):'<p class="mut">ما كاين حتى تسجيل.</p>';
}
function vSea(){
  $('v').innerHTML='<div class="card"><label for="sq">ابحث بالقيد أو الاسم أو اللقب</label><input id="sq" autocomplete="off"><div id="sres"></div></div><div id="sfile"></div>';
  $('sq').addEventListener('input',sSearch);
  $('sres').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)sFile(b.dataset.m)});
}
function sSearch(){
  const q=$('sq').value.trim().toLowerCase();$('sfile').innerHTML='';
  if(!q){$('sres').innerHTML='';return}
  const ex=who(q);if(ex){$('sres').innerHTML='';sFile(ex[0]);return}
  const f=W.filter(w=>(w[1]+' '+w[2]).toLowerCase().includes(q)||w[0].toLowerCase().includes(q)).slice(0,20);
  $('sres').innerHTML=f.length?f.map(w=>'<button data-m="'+esc(w[0])+'" style="width:100%;text-align:right;margin-top:8px">'+esc((w[1]+' '+w[2]).trim())+' <span class="mut">القيد '+esc(w[0])+'</span></button>').join(''):'<p class="mut">ما لقيتش حتى عامل.</p>';
}
function sFile(m){
  const w=who(m);if(!w)return;
  const rs=R.filter(r=>nk(r.m)===nk(m)).sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);
  const sec=k=>{const l=rs.filter(r=>r.t===k);return '<div class="card"><b>'+TYPES[k].label+' ('+l.length+')</b>'+(l.length?l.map(r=>'<div class="it '+TYPES[k].cls+'"><div class="top"><span>'+esc(r.k)+'</span><span class="mut">'+fromISO(r.d)+'</span></div>'+(r.note?'<div class="mut">'+esc(r.note)+'</div>':'')+'</div>').join(''):'<p class="mut">لا شيء.</p>')+'</div>'};
  $('sfile').innerHTML='<div class="card"><b>'+esc((w[1]+' '+w[2]).trim())+'</b><div class="mut">القيد '+esc(w[0])+'</div><div class="sum">'+Object.keys(TYPES).map(k=>'<div><b>'+rs.filter(r=>r.t===k).length+'</b>'+TYPES[k].label+'</div>').join('')+'</div></div>'+['epi','inc','sanc'].map(sec).join('');
}
function parse(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(line=>{
    const c=line.split(/\t|\s{2,}/).map(s=>s.trim()).filter(Boolean);if(c.length<2)return;
    let mi=c.findIndex(x=>/^\d[\d\-\/]*$/.test(x));if(mi<0)mi=c.findIndex(x=>/\d/.test(x));if(mi<0)return;
    const rest=c.filter((_,i)=>i!==mi);out.push([c[mi],rest[0]||'',rest[1]||'']);
  });
  return out;
}
function vWrk(){
  $('v').innerHTML=`<div class="card"><b>قاعدة بيانات العمال: <span id="cnt">${W.length}</span></b>
  <label for="pa">ألصق قائمة من Excel (اللقب، الاسم، القيد)</label><textarea id="pa" placeholder="اللقب  الاسم  القيد"></textarea>
  <button class="main" id="merge">إضافة ودمج مع القائمة</button><button class="main" id="repl" style="background:var(--card);color:var(--bad);border-color:var(--bad)">استبدال القائمة كاملة</button><div id="wm" class="hint" role="status"></div></div>
  <div class="card"><b>إضافة عامل واحد</b><label for="a1">القيد</label><input id="a1" inputmode="numeric"><label for="a2">اللقب</label><input id="a2"><label for="a3">الاسم</label><input id="a3"><button class="main" id="one">إضافة</button></div>`;
  const msg=(t,bad)=>{$('wm').textContent=t;$('wm').className='hint'+(bad?' err':'')};
  const apply=async(arr,replace)=>{
    if(!arr.length){msg('ما لقيتش بيانات صالحة. تأكد من وجود رقم القيد في كل سطر.',1);return}
    const old=W;try{
      if(replace){if(!confirm('استبدال '+old.length+' عامل بـ '+arr.length+'؟'))return;W=arr}
      else{const m=new Map(W.map(w=>[nk(w[0]),w]));arr.forEach(w=>m.set(nk(w[0]),w));W=[...m.values()]}
      await saveW();$('cnt').textContent=W.length;msg('تحفظ ✓ العدد الآن '+W.length)
    }catch(e){W=old;idx();msg('ما تحفظش ('+(e&&(e.code||e.message)||'خطأ')+')',1)}
  };
  $('merge').onclick=()=>apply(parse($('pa').value),false);$('repl').onclick=()=>apply(parse($('pa').value),true);
  $('one').onclick=()=>{const m=$('a1').value.trim();if(!m||!($('a2').value.trim()||$('a3').value.trim())){msg('أدخل القيد والاسم.',1);return}apply([[m,$('a2').value.trim(),$('a3').value.trim()]],false).then(()=>{$('a1').value=$('a2').value=$('a3').value=''})};
}
function vSet(){
  $('v').innerHTML=`<div class="card"><b>تغيير الرمز السرّي</b><label for="np">رمز جديد (6 أرقام)</label><input id="np" inputmode="numeric" maxlength="6" type="password"><button class="main" id="cp">حفظ الرمز</button>
  <button class="main" id="ex" style="background:var(--card);color:var(--ink);border-color:var(--line)">تصدير السجلّ (CSV)</button><button class="main" id="lk" style="background:var(--card);color:var(--ink);border-color:var(--line)">قفل التطبيق</button><div id="sm2" class="hint" role="status"></div>
  <p class="mut">ملاحظة: الرمز السرّي يحمي الدخول من الواجهة فقط، وهو ليس تشفيرا للبيانات.</p></div>`;
  const msg=(t,bad)=>{$('sm2').textContent=t;$('sm2').className='hint'+(bad?' err':'')};
  $('cp').onclick=async()=>{const v=$('np').value;if(!/^\d{6}$/.test(v)){msg('لازم 6 أرقام.',1);return}try{cfg.pin=await H(v);await saveCfg();$('np').value='';msg('تبدّل الرمز ✓')}catch(e){msg('ما تبدّلش الرمز.',1)}};
  $('lk').onclick=lockNow;
  $('ex').onclick=async()=>{
    const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',L=['القيد,اللقب,الاسم,النوع,التفاصيل,التاريخ,ملاحظات'];
    R.slice().sort((a,b)=>a.d.localeCompare(b.d)).forEach(r=>{const w=who(r.m)||[r.m,'',''];L.push([w[0],w[1],w[2],TYPES[r.t].label,r.k,fromISO(r.d),r.note].map(q).join(','))});
    try{const data='\ufeff'+L.join('\r\n');let d=null;try{d=window.claude&&claude.use?await claude.use('downloads'):null}catch(x){}if(d)await d.save({filename:'سجل-HSE.csv',data:data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='سجل-HSE.csv';document.body.appendChild(a);a.click();a.remove()}msg('تصدّر ✓')}
    catch(e){msg(e&&e.code==='declined'?'':'ما تصدّرش ('+(e&&(e.code||e.message)||'خطأ')+')',1)}
  };
}
init();
})();
</script>
